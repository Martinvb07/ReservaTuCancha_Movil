# Bloques para /etc/nginx/sites-available/reservatucancha
#
# Van DENTRO del `server { listen 443 ssl; ... }`, antes del `location /` que
# hace proxy al Next (nginx elige `location =` exacto antes que el prefijo, asi
# que el orden no es critico, pero es mas claro tenerlos arriba).
#
# Los dos archivos se copian a /var/www/rtc-app/ y se sirven estaticos: no
# tocan ni el Frontend ni el Backend, y no hay que redesplegar nada.
#
#   mkdir -p /var/www/rtc-app
#   # subir volver.html y assetlinks.json ahi
#   chown -R www-data:www-data /var/www/rtc-app
#   nginx -t && systemctl reload nginx

# ── La vuelta del checkout de Wompi ──────────────────────────────────────
# Wompi manda aca al terminar el pago; esta pagina rebota a
# reservatucancha://pago?bookingId=... y eso abre la app.
location = /app/volver {
    default_type text/html;
    alias /var/www/rtc-app/volver.html;

    # Sin cache: si algun dia cambia el esquema, no queremos telefonos
    # rebotando a una direccion vieja.
    add_header Cache-Control "no-store";
}

# ── Verificacion del dominio para Android App Links ──────────────────────
# Esto NO hace falta para el pago (ese va por el esquema propio). Sirve para
# que los links de los CORREOS (cancelar, reprogramar, resenar) abran la app
# en vez del navegador.
location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /var/www/rtc-app/assetlinks.json;
    add_header Cache-Control "public, max-age=3600";
}
